name: Frontend CI

on:
  push:
    branches:
      - icpworld-onchain-upgrade
  pull_request:
    branches:
      - main
      - icpworld-onchain-upgrade

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @caffeine/template-frontend typecheck
      - name: Build frontend
        run: pnpm --filter @caffeine/template-frontend build
